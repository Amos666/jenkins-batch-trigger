name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    name: Build VSIX Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Package VSIX
        run: npx @vscode/vsce package --out jenkins-batch-trigger-${{ github.ref_name }}.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: jenkins-batch-trigger-${{ github.ref_name }}.vsix
          path: jenkins-batch-trigger-${{ github.ref_name }}.vsix

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: jenkins-batch-trigger-${{ github.ref_name }}.vsix
          generate_release_notes: true
